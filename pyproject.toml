[project]
name = "gurita-tooling"
version = "2.0.0"
description = "Development tooling for the Gurita plugin (host build and version script)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["core/tools"]
testpaths = ["tests"]
