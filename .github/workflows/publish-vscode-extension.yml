name: publish-vscode-extension

on:
  push:
    tags:
      - 'gurita-vscode-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: extension-release
    permissions:
      contents: read
      id-token: write # Marketplace trusted publishing: vsce publish --oidc exchanges the job's OIDC token
    defaults:
      run:
        working-directory: gurita-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath dist/gurita-vscode.vsix --skip-duplicate
      - name: Publish to Open VSX
        run: npx ovsx publish dist/gurita-vscode.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
