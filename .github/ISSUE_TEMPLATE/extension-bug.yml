name: Extension bug report
description: Gurita for VS Code misbehaved — its side-bar view, a mission window, the Settings window, or a recipe run. The three required facts are what an extension bug cannot be reproduced without.
title: "[Extension bug]: "
labels: ["bug"]
body:
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: The version of Gurita for VS Code (`BusyMinds.gurita-vscode`) you have installed, shown on its page in the editor's Extensions view.
      placeholder: MAJOR.MINOR.PATCH
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and its version
      description: The editor the extension runs in and that editor's version — VS Code, VSCodium, Cursor, Windsurf, Antigravity, or another — as its About dialog shows it.
      placeholder: "VS Code 1.143.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The operating system the editor runs on. Under Remote-WSL, choose Remote-WSL rather than Windows.
      options:
        - macOS
        - Linux
        - Remote-WSL
        - Windows (native)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected the extension to do, what it did instead, and the message, view, or run output that shows the difference.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: The steps that lead to it, if you can reproduce it — the mission and its state, the row or button clicked, the recipe and variant run, and the installed plugin's version.
    validations:
      required: false
